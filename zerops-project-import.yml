project:
  name: beacon
  tags:
    - zerops-challenge

services:
  - hostname: db
    type: postgresql@16
    mode: NON_HA
    priority: 10

  - hostname: cache
    type: valkey@7.2
    mode: NON_HA
    priority: 10

  - hostname: app
    type: nodejs@20
    buildFromGit: https://github.com/pulkitgovrani/beacon-zerops-challenge
    enableSubdomainAccess: true
    priority: 5

  - hostname: worker
    type: nodejs@20
    buildFromGit: https://github.com/pulkitgovrani/beacon-zerops-challenge
    priority: 5
